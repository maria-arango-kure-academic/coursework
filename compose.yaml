name: vfi-simulation
services:
  simulation:
    image: ${VFI_IMAGE:-vfi-simulation:local}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8796:8766"
    env_file: ${VFI_ENV_FILE:-.env}
    environment:
      FAIRPASS_DB: /data/vfi.sqlite3
      FAIRPASS_PUBLIC_ORIGIN: https://vfi.coursework.live
    volumes:
      - ${VFI_DATA_DIR:-./data}:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
